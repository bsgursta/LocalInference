spring.application.name=localinference
spring.devtools.restart.enabled=true


server.port=8080
server.ip=127.0.0.1

socket.port=9000


spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Database connection - map to docker .env
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/li-db
spring.datasource.username=databaseuser
spring.datasource.password=databasepassword

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false


# JWT
# Secret key. Must be at least 256 bits (32 bytes) for HS256
# In production this must come from an environment variable, never hardcoded
jwt.secret=${JWT_SECRET:localdevonlysecretkeyfortestingpurposesonly1234}
jwt.access-token.expiration=900000 
jwt.refresh-token.expiration=604800000