spring.application.name=localinference

server.ip=127.0.0.1
server.port=8080

spring.devtools.restart.enabled=true
server.error.include-stacktrace=always


# Database connection - map to docker .env
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}


# JPA / Hibernate settings
spring.jpa.show-sql=true


# CORS: allow local frontend dev server
cors.allowed-origins=${ALLOWED_ORIGINS:http://127.0.0.1}


# Disable swagger on prod
springdoc.swagger-ui.enabled=true

